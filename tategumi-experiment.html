<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>縦書きプレビュー</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a18;
    --paper: #f7f4ef;
    --muted: #9a9690;
    --line: #dedad4;
    --accent: #5a4a3a;
  }

  html, body {
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    grid-template-rows: auto 1fr;
    height: 100dvh;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    grid-column: 1 / -1;
    padding: 28px 40px 20px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: var(--accent);
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
  }

  .divider {
    grid-row: 2;
    grid-column: 2;
    background: var(--line);
    width: 1px;
  }

  /* 左 */
  .input-pane {
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-size: 14px;
    line-height: 1.9;
  }

  /* 右 */
  .preview-pane {
    padding: 40px 48px;
    overflow-x: auto;
    display: flex;
    justify-content: flex-end;
  }

  .tategumi {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    line-height: 2;
    letter-spacing: 0.08em;
    height: calc(100dvh - 120px);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .tategumi.empty::after {
    content: 'テキストを入力すると\Aここに縦書きで表示されます';
    white-space: pre;
    color: var(--muted);
    opacity: 0.5;
  }

  /* =========================
     全画面（ここが修正済み）
  ========================= */

  .fullscreen-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 1000;

    overflow-x: auto;
    overflow-y: hidden;
    padding: 20px 80px 20px 20px;

    /* ★重要修正 */
    display: none;
  }

  .fullscreen-overlay.active {
    display: flex;              /* ← blockじゃなくflex */
    justify-content: flex-end;  /* ←右寄せ */
    align-items: flex-start;    /* ←上寄せ */
  }

  /* ★重要修正：短文右寄せ安定 */
  .fullscreen-overlay .tategumi-full {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: 'Noto Serif JP', serif;
    font-weight: 300;
    line-height: 2;
    letter-spacing: 0.08em;

    display: inline-block;   /* ←追加 */
    width: max-content;      /* ←追加 */

    height: calc(100dvh - 80px);
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* 閉じるボタン（そのまま） */
  .fullscreen-close {
    position: fixed;
    top: 12px;
    right: 12px;
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(247, 244, 239, 0.6);
    color: var(--ink);
    font-size: 10px;
    padding: 4px 10px;
    z-index: 1001;
    backdrop-filter: blur(4px);
    opacity: 1;
  }

  .fullscreen-close:hover {
    background: rgba(26, 26, 24, 0.8);
    color: var(--paper);
  }

  /* ツールバー（そのまま） */
  .toolbar {
    position: fixed;
    bottom: 28px;
    right: 40px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-size: 12px;
    padding: 6px 16px;
    cursor: pointer;
  }

  .btn:hover {
    background: var(--ink);
    color: var(--paper);
  }

</style>
</head>

<body>

<div class="layout">
  <header>
    <h1>縦書きプレビュー</h1>
    <span class="subtitle">note 用</span>
  </header>

  <div class="input-pane">
    <textarea id="input" placeholder="noteの文章をここに"></textarea>
  </div>

  <div class="divider"></div>

  <div class="preview-pane">
    <div class="tategumi empty" id="preview"></div>
  </div>
</div>

<!-- fullscreen -->
<div class="fullscreen-overlay" id="fullscreenOverlay">
  <button class="fullscreen-close" id="btnClose">✕ 閉じる</button>
  <div class="tategumi-full" id="fullPreview"></div>
</div>

<div class="toolbar">
  <button id="btnFullscreen">全画面</button>
</div>

<script>
const input = document.getElementById('input');
const preview = document.getElementById('preview');

function toTategumi(text){
  if(!text) return '';
  return text
    .replace(/</g,'&lt;')
    .replace(/>/g,'＞');
}

input.addEventListener('input', () => {
  preview.innerHTML = toTategumi(input.value);
  preview.classList.toggle('empty', !input.value.trim());
});

const overlay = document.getElementById('fullscreenOverlay');
const fullPreview = document.getElementById('fullPreview');

document.getElementById('btnFullscreen').addEventListener('click', () => {
  fullPreview.innerHTML = preview.innerHTML;
  overlay.classList.add('active');
});

document.getElementById('btnClose').addEventListener('click', () => {
  overlay.classList.remove('active');
});
</script>

</body>
</html>
