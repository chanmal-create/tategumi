<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>縦書きプレビュー</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300&family=Shippori+Mincho:wght@400&family=Hina+Mincho&family=Kaisei+Decol&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a18;
    --paper: #f7f4ef;
    --muted: #9a9690;
    --line: #dedad4;
    --accent: #5a4a3a;
  }

  html, body {
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    overflow: hidden;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    grid-template-rows: auto 1fr;
    height: 100dvh;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    grid-column: 1 / -1;
    padding: 28px 40px 20px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: var(--accent);
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
  }

  .divider {
    grid-row: 2;
    grid-column: 2;
    background: var(--line);
    width: 1px;
  }

  .input-pane {
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    writing-mode: horizontal-tb;
  }

  .pane-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.9;
    color: var(--ink);
    caret-color: var(--accent);
    writing-mode: horizontal-tb;
  }

  textarea::placeholder {
    color: var(--muted);
    opacity: 0.6;
  }

  .preview-pane {
    padding: 40px 48px;
    overflow-x: auto;
    overflow-y: hidden;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
  }

  .tategumi {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 300;
    line-height: 2;
    letter-spacing: 0.08em;
    color: var(--ink);
    height: calc(100dvh - 140px);
    white-space: pre-wrap;
    word-break: break-all;
    transition: font-size 0.15s;
  }

  .tategumi.empty::after {
    content: 'テキストを入力すると\Aここに縦書きで表示されます';
    white-space: pre;
    color: var(--muted);
    opacity: 0.5;
    font-size: 13px;
  }

  .fullscreen-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 1000;
    overflow-x: scroll;
    overflow-y: hidden;
    padding: 40px;
    justify-content: flex-end;
    align-items: flex-start;
    -webkit-overflow-scrolling: touch;
  }

  .fullscreen-overlay.active {
    display: flex;
  }

  .tategumi-full {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: 'Noto Serif JP', serif;
    font-weight: 300;
    line-height: 2;
    letter-spacing: 0.08em;
    color: var(--ink);
    height: calc(100dvh - 80px);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .toolbar {
    position: fixed;
    bottom: 28px;
    right: 40px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(247, 244, 239, 0.9);
    padding: 4px 8px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }

  .size-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.1em;
    padding: 6px 16px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    border-radius: 2px;
  }

  .btn:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .btn-size {
    padding: 5px 10px;
    font-size: 12px;
    min-width: 38px;
    text-align: center;
  }

  .preview-pane::-webkit-scrollbar,
  .fullscreen-overlay::-webkit-scrollbar { height: 6px; }
  .preview-pane::-webkit-scrollbar-track,
  .fullscreen-overlay::-webkit-scrollbar-track { background: transparent; }
  .preview-pane::-webkit-scrollbar-thumb,
  .fullscreen-overlay::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .preview-pane::-webkit-scrollbar-thumb:hover,
  .fullscreen-overlay::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  @media (max-width: 680px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr 1px 1.2fr;
      height: 100dvh;
    }
    .divider { grid-row: 3; grid-column: 1; height: 1px; width: 100%; }
    .input-pane { grid-row: 2; height: 100%; padding: 20px; }
    .preview-pane { grid-row: 4; padding: 20px; height: 100%; }
    .tategumi { height: calc(100% - 40px); }
    header { padding: 16px 20px 12px; }
    h1 { font-size: 13px; }
    .toolbar { bottom: 12px; right: 12px; gap: 4px; padding: 2px; }
    .btn { padding: 4px 8px; font-size: 11px; }
    .btn-size { padding: 4px 6px; min-width: 30px; }
    .size-label { display: none; }
  }
</style>
</head>
<body>

<div class="layout">
  <header>
    <h1>縦書きプレビュー</h1>
    <span class="subtitle">note 用</span>
  </header>

  <div class="input-pane">
    <div class="pane-label">横書き入力</div>
    <textarea id="input" placeholder="note の文章をここにペーストしてください…" spellcheck="false"></textarea>
  </div>

  <div class="divider"></div>

  <div class="preview-pane" id="previewPane">
    <div class="tategumi empty" id="preview"></div>
  </div>
</div>

<div class="fullscreen-overlay" id="fullscreenOverlay">
  <div class="tategumi-full" id="fullPreview"></div>
</div>

<div class="toolbar">
  <span class="size-label">フォント</span>
  <button class="btn btn-size" id="btnGothic">ゴシック</button>
  <button class="btn btn-size" id="btnShippori">筆</button>
  <button class="btn btn-size" id="btnKaisei">装飾</button>
  <button class="btn btn-size" id="btnHina">細い</button>
  <span class="size-label">文字サイズ</span>
  <button class="btn btn-size" id="btnSmall">小</button>
  <button class="btn btn-size" id="btnMedium">中</button>
  <button class="btn btn-size" id="btnLarge">大</button>
  <button class="btn btn-size" id="btnXLarge">特大</button>
  <button class="btn" id="btnClear">クリア</button>
  <button class="btn" id="btnFullscreen">全画面</button>
</div>

<script>
  const input = document.getElementById('input');
  const preview = document.getElementById('preview');
  const fullPreview = document.getElementById('fullPreview');
  const overlay = document.getElementById('fullscreenOverlay');
  const sizes = { small: '13px', medium: '15px', large: '18px', xlarge: '24px' };
  let currentSize = sizes.medium;
  let currentFont = "'Noto Serif JP', serif";

  // 半角英数→全角変換
  function toZen(s) {
    return s.replace(/[A-Za-z0-9]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0));
  }

  function toTategumi(text) {
    if (!text) return '';
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/[A-Za-z0-9]+/g, m => toZen(m));
  }

  input.addEventListener('input', () => {
    const val = input.value;
    preview.innerHTML = toTategumi(val);
    preview.classList.toggle('empty', val.trim() === '');
  });

  function setSize(size) {
    currentSize = size;
    preview.style.fontSize = size;
    const headerH = document.querySelector('header').offsetHeight;
    preview.style.height = 'calc(100dvh - ' + (headerH + 60) + 'px)';
  }

  function setFont(font) {
    currentFont = font;
    preview.style.fontFamily = font;
    fullPreview.style.fontFamily = font;
  }

  setSize(sizes.medium);

  document.getElementById('btnSmall').addEventListener('click', () => setSize(sizes.small));
  document.getElementById('btnMedium').addEventListener('click', () => setSize(sizes.medium));
  document.getElementById('btnLarge').addEventListener('click', () => setSize(sizes.large));
  document.getElementById('btnXLarge').addEventListener('click', () => setSize(sizes.xlarge));

  document.getElementById('btnGothic').addEventListener('click', () => setFont("'Hiragino Sans', 'Noto Sans JP', sans-serif"));
  document.getElementById('btnShippori').addEventListener('click', () => setFont("'Shippori Mincho', serif"));
  document.getElementById('btnKaisei').addEventListener('click', () => setFont("'Kaisei Decol', serif"));
  document.getElementById('btnHina').addEventListener('click', () => setFont("'Hina Mincho', serif"));

  document.getElementById('btnClear').addEventListener('click', () => {
    input.value = '';
    preview.innerHTML = '';
    preview.classList.add('empty');
    input.focus();
  });

  document.getElementById('btnFullscreen').addEventListener('click', () => {
    if (input.value.trim() === '') return;
    fullPreview.innerHTML = preview.innerHTML + '<br><br><br><br><br>';
    fullPreview.style.fontSize = currentSize;
    fullPreview.style.fontFamily = currentFont;
    overlay.classList.add('active');
    setTimeout(() => {
      overlay.scrollLeft = overlay.scrollWidth - overlay.clientWidth;
    }, 10);
  });

  function closeFullscreen() {
    overlay.classList.remove('active');
  }

  const previewPane = document.getElementById('previewPane');
  previewPane.addEventListener('wheel', (e) => {
    e.preventDefault();
    previewPane.scrollLeft -= e.deltaY;
  }, { passive: false });

  overlay.addEventListener('dblclick', closeFullscreen);

  let lastTap = 0;
  let touchStartTime = 0;
  overlay.addEventListener('touchstart', () => { touchStartTime = Date.now(); });
  overlay.addEventListener('touchend', (e) => {
    if (Date.now() - touchStartTime > 150) return;
    const tapLen = Date.now() - lastTap;
    if (tapLen < 250 && tapLen > 40) { closeFullscreen(); e.preventDefault(); }
    lastTap = Date.now();
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFullscreen(); });

  overlay.addEventListener('wheel', (e) => {
    if (!overlay.classList.contains('active')) return;
    e.preventDefault();
    overlay.scrollLeft -= e.deltaY;
  }, { passive: false });
</script>
</body>
</html>
