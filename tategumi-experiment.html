<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>縦書きプレビュー</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300&family=Shippori+Mincho:wght@400&family=Hina+Mincho&family=Kaisei+Decol&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a18;
    --paper: #f7f4ef;
    --muted: #9a9690;
    --line: #dedad4;
    --accent: #5a4a3a;
  }

  html, body {
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    overflow: hidden;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    grid-template-rows: auto 1fr;
    height: 100dvh;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    grid-column: 1 / -1;
    padding: 28px 40px 20px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: var(--accent);
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
  }

  .divider {
    grid-row: 2;
    grid-column: 2;
    background: var(--line);
    width: 1px;
  }

  .input-pane {
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    writing-mode: horizontal-tb;
  }

  .pane-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.9;
    color: var(--ink);
    caret-color: var(--accent);
    writing-mode: horizontal-tb;
  }

  textarea::placeholder {
    color: var(--muted);
    opacity: 0.6;
  }

  .preview-pane {
    padding: 40px 48px;
    overflow-x: auto;
    overflow-y: hidden;
    display: flex;
    align-items: flex-start;
  }

  .tategumi {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 300;
    line-height: 2;
    letter-spacing: 0.08em;
    color: var(--ink);
    height: calc(100dvh - 140px);
    white-space: pre-wrap;
    word-break: break-all;
    transition: font-size 0.15s;
    flex-shrink: 0;
  }

  .tategumi.empty::after {
    content: 'テキストを入力すると\Aここに縦書きで表示されます';
    white-space: pre;
    color: var(--muted);
    opacity: 0.5;
    font-size: 13px;
  }

  /* 記事内の画像。絵本のように、文章の流れを区切って独立した1本の柱として挟む */
  /* max-heightをem指定にすることで、文字サイズが変わると画像サイズも自動で連動して比例する */
  .tategumi img {
    display: block;
    max-height: 18em;
    width: auto;
    margin: 24px 20px;
    border-radius: 2px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }

  .tategumi .yt-thumb {
    position: relative;
    display: inline-block;
  }

  .tategumi .yt-thumb::after {
    content: '▶';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 22px;
    text-shadow: 0 0 6px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  .fullscreen-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 1000;
    overflow-x: scroll;
    overflow-y: hidden;
    padding: 40px;
    align-items: flex-start;
    -webkit-overflow-scrolling: touch;
  }

  .fullscreen-overlay.active {
    display: flex;
  }

  .tategumi-full {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: 'Noto Serif JP', serif;
    font-weight: 300;
    line-height: 2;
    letter-spacing: 0.08em;
    color: var(--ink);
    height: calc(100dvh - 80px);
    white-space: pre-wrap;
    word-break: break-all;
  }

  .tategumi-full img {
    display: block;
    max-height: 18em;
    width: auto;
    margin: 24px 20px;
    border-radius: 2px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }

  .toolbar {
    position: fixed;
    bottom: 28px;
    right: 40px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(247, 244, 239, 0.9);
    padding: 4px 8px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }

  .size-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.1em;
    padding: 6px 16px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    border-radius: 2px;
  }

  .btn:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .btn-size {
    padding: 5px 10px;
    font-size: 12px;
    min-width: 38px;
    text-align: center;
  }

  .preview-pane::-webkit-scrollbar,
  .fullscreen-overlay::-webkit-scrollbar { height: 6px; }
  .preview-pane::-webkit-scrollbar-track,
  .fullscreen-overlay::-webkit-scrollbar-track { background: transparent; }
  .preview-pane::-webkit-scrollbar-thumb,
  .fullscreen-overlay::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .preview-pane::-webkit-scrollbar-thumb:hover,
  .fullscreen-overlay::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  @supports (-webkit-touch-callout: none) {
    .preview-pane,
    .fullscreen-overlay {
      scrollbar-width: none;
    }
    .preview-pane::-webkit-scrollbar,
    .fullscreen-overlay::-webkit-scrollbar {
      display: none;
    }
  }

  @media (max-width: 680px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr 1px 1.2fr;
      height: 100dvh;
    }
    .divider { grid-row: 3; grid-column: 1; height: 1px; width: 100%; }
    .input-pane { grid-row: 2; height: 100%; padding: 20px; }
    .preview-pane { grid-row: 4; padding: 20px; height: 100%; }
    .tategumi { height: calc(100% - 40px); }
    header { padding: 16px 20px 12px; }
    h1 { font-size: 13px; }
    .toolbar { bottom: 12px; right: 12px; gap: 4px; padding: 2px; }
    .btn { padding: 4px 8px; font-size: 11px; }
    .btn-size { padding: 4px 6px; min-width: 30px; }
    .size-label { display: none; }
  }
</style>
</head>
<body>

<div class="layout">
  <header>
    <h1>縦書きプレビュー</h1>
    <span class="subtitle">note 用</span>
  </header>

  <div class="input-pane">
    <div class="pane-label">横書き入力</div>
    <textarea id="input" placeholder="note の文章をここにペーストしてください…" spellcheck="false"></textarea>
  </div>

  <div class="divider"></div>

  <div class="preview-pane" id="previewPane">
    <div class="tategumi empty" id="preview"></div>
  </div>
</div>

<div class="fullscreen-overlay" id="fullscreenOverlay">
  <div class="tategumi-full" id="fullPreview"></div>
</div>

<div class="toolbar">
  <span class="size-label">フォント</span>
  <button class="btn btn-size" id="btnGothic">ゴシック</button>
  <button class="btn btn-size" id="btnShippori">筆</button>
  <button class="btn btn-size" id="btnKaisei">装飾</button>
  <button class="btn btn-size" id="btnHina">細い</button>
  <span class="size-label">文字サイズ</span>
  <button class="btn btn-size" id="btnSmall">小</button>
  <button class="btn btn-size" id="btnMedium">中</button>
  <button class="btn btn-size" id="btnLarge">大</button>
  <button class="btn btn-size" id="btnXLarge">特大</button>
  <button class="btn" id="btnClear">クリア</button>
  <button class="btn" id="btnFullscreen">全画面</button>
</div>

<script>
  const input = document.getElementById('input');
  const preview = document.getElementById('preview');
  const previewPane = document.getElementById('previewPane');
  const fullPreview = document.getElementById('fullPreview');
  const overlay = document.getElementById('fullscreenOverlay');

  // 文字サイズと画像サイズをセットで管理(文字を大きくしたら画像も一緒に大きくする)
  const sizeTable = {
    small:  { font: '13px', img: '140px' },
    medium: { font: '15px', img: '180px' },
    large:  { font: '18px', img: '220px' },
    xlarge: { font: '24px', img: '280px' }
  };
  let currentSizeKey = 'medium';
  let currentFont = "'Noto Serif JP', serif";

  // richSegments: ブックマークレット経由で「文章+画像」の順番付きデータが来たときに保持する
  // (手動でテキストエリアを編集した場合はnullに戻し、通常のテキストのみ表示に切り替える)
  let richSegments = null;

  function toZen(s) {
    return s.replace(/[A-Za-z0-9]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0));
  }

  function escapeAndZen(text) {
    if (!text) return '';
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/[A-Za-z0-9]+/g, m => toZen(m));
  }

  // 通常のテキストのみ表示(今まで通りの挙動)
  function toTategumi(text) {
    return escapeAndZen(text);
  }

  // segments配列(文章と画像が順番通りに並んだデータ)からHTMLを組み立てる
  // 画像のサイズはCSS側で em(文字サイズに連動する単位)指定にしているので、ここでは高さを直接指定しない
  // 文章の段落同士の間には改行を入れて、手動コピペと同じように余白ができるようにする
  function segmentsToHtml(segments) {
    let html = '';
    segments.forEach((seg, i) => {
      if (seg.type === 'image') {
        const cls = seg.isVideo ? ' class="yt-thumb"' : '';
        html += '<img' + cls + ' src="' + seg.src.replace(/"/g, '&quot;') + '" alt="">';
      } else {
        html += escapeAndZen(seg.content);
        const next = segments[i + 1];
        if (next && next.type === 'text') html += '\n\n';
      }
    });
    return html;
  }

  function renderPreview() {
    const val = input.value;
    if (richSegments) {
      preview.innerHTML = segmentsToHtml(richSegments);
      preview.classList.toggle('empty', richSegments.length === 0);
    } else {
      preview.innerHTML = toTategumi(val);
      preview.classList.toggle('empty', val.trim() === '');
    }
    requestAnimationFrame(() => {
      previewPane.scrollLeft = previewPane.scrollWidth - previewPane.clientWidth;
    });
  }

  // ユーザーが手で入力欄をいじったら、画像付き表示はやめて通常のテキスト表示に戻す
  // (順番情報がズレる可能性があるため)
  input.addEventListener('input', () => {
    richSegments = null;
    renderPreview();
  });

  // ブックマークレットから届いたデータを受け取る
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (typeof data !== 'string') return;
    const trimmed = data.trim();
    if (!trimmed) return;

    // JSON形式(文章+画像の構造化データ)かどうか試す
    let parsed = null;
    try { parsed = JSON.parse(trimmed); } catch (e) { /* JSONでなければ通常テキスト */ }

    if (parsed && parsed.type === 'tategumi-segments' && Array.isArray(parsed.segments)) {
      richSegments = parsed.segments;
      // テキストエリア側には画像を除いた文章だけを流し込み、手動編集の起点にする
      input.value = parsed.segments
        .filter(s => s.type === 'text')
        .map(s => s.content)
        .join('\n\n');
      renderPreview();
      return;
    }

    // 従来通りのプレーンテキスト受信
    richSegments = null;
    input.value = data;
    renderPreview();
  });

  function applySizeVars() {
    const t = sizeTable[currentSizeKey];
    preview.style.fontSize = t.font;
    fullPreview.style.fontSize = t.font;
    const headerH = document.querySelector('header').offsetHeight;
    preview.style.height = 'calc(100dvh - ' + (headerH + 60) + 'px)';
  }

  function setSize(key) {
    currentSizeKey = key;
    applySizeVars();
    // 画像付き表示中なら、画像サイズも新しいサイズで作り直す
    if (richSegments) renderPreview();
  }

  function setFont(font) {
    currentFont = font;
    preview.style.fontFamily = font;
    fullPreview.style.fontFamily = font;
  }

  applySizeVars();

  document.getElementById('btnSmall').addEventListener('click', () => setSize('small'));
  document.getElementById('btnMedium').addEventListener('click', () => setSize('medium'));
  document.getElementById('btnLarge').addEventListener('click', () => setSize('large'));
  document.getElementById('btnXLarge').addEventListener('click', () => setSize('xlarge'));

  document.getElementById('btnGothic').addEventListener('click', () => setFont("'Hiragino Sans', 'Noto Sans JP', sans-serif"));
  document.getElementById('btnShippori').addEventListener('click', () => setFont("'Shippori Mincho', serif"));
  document.getElementById('btnKaisei').addEventListener('click', () => setFont("'Kaisei Decol', serif"));
  document.getElementById('btnHina').addEventListener('click', () => setFont("'Hina Mincho', serif"));

  document.getElementById('btnClear').addEventListener('click', () => {
    input.value = '';
    richSegments = null;
    preview.innerHTML = '';
    preview.classList.add('empty');
    input.focus();
  });

  document.getElementById('btnFullscreen').addEventListener('click', () => {
    if (input.value.trim() === '' && !richSegments) return;
    fullPreview.innerHTML = preview.innerHTML + '<br><br><br><br><br>';
    fullPreview.style.fontFamily = currentFont;
    overlay.classList.add('active');
    setTimeout(() => {
      overlay.scrollLeft = overlay.scrollWidth - overlay.clientWidth;
    }, 10);
  });

  function closeFullscreen() {
    overlay.classList.remove('active');
  }

  previewPane.addEventListener('wheel', (e) => {
    e.preventDefault();
    previewPane.scrollLeft -= e.deltaY;
  }, { passive: false });

  overlay.addEventListener('dblclick', closeFullscreen);

  let lastTap = 0;
  let touchStartTime = 0;
  overlay.addEventListener('touchstart', () => { touchStartTime = Date.now(); });
  overlay.addEventListener('touchend', (e) => {
    if (Date.now() - touchStartTime > 150) return;
    const tapLen = Date.now() - lastTap;
    if (tapLen < 250 && tapLen > 40) { closeFullscreen(); e.preventDefault(); }
    lastTap = Date.now();
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFullscreen(); });

  overlay.addEventListener('wheel', (e) => {
    if (!overlay.classList.contains('active')) return;
    e.preventDefault();
    overlay.scrollLeft -= e.deltaY;
  }, { passive: false });
</script>
</body>
</html>
