<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>縦書きプレビュー</title>
<style>
  @import   url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300&family=Shippori+Mincho:wght@400&family=Zen+Antique&family=Hina+Mincho&family=Kaisei+Decol&display=swap');


  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a18;
    --paper: #f7f4ef;
    --muted: #9a9690;
    --line: #dedad4;
    --accent: #5a4a3a;
  }

  html, body {
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    overflow: hidden;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    grid-template-rows: auto 1fr;
    height: 100dvh;
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    grid-column: 1 / -1;
    padding: 28px 40px 20px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: var(--accent);
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
  }

  .divider {
    grid-row: 2;
    grid-column: 2;
    background: var(--line);
    width: 1px;
  }

  /* --- 左：入力 --- */
  .input-pane {
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    writing-mode: horizontal-tb;
  }

  .pane-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.9;
    color: var(--ink);
    caret-color: var(--accent);
    writing-mode: horizontal-tb;
    text-orientation: mixed;
  }

  textarea::placeholder {
    color: var(--muted);
    opacity: 0.6;
  }

  /* --- 右：プレビュー --- */
  .preview-pane {
    padding: 40px 48px;
    overflow-x: auto;
    overflow-y: hidden;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
  }

  .tategumi {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 300;
    line-height: 2;
    letter-spacing: 0.08em;
    color: var(--ink);
    height: calc(100dvh - 140px);
    white-space: pre-wrap;
    word-break: break-all;
    -webkit-font-feature-settings: "vert" 1;
    font-feature-settings: "vert" 1;
    transition: font-size 0.15s;
  }

  /* 全画面モード */
  .fullscreen-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 1000;
    overflow-x: scroll;
    overflow-y: hidden;
    padding: 40px 40px 40px 40px;
    justify-content: flex-end;
    align-items: flex-start;
    -webkit-overflow-scrolling: touch;
  }

  .fullscreen-overlay.active {
    display: flex;
  }

  .fullscreen-overlay .tategumi-full {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: 'Noto Serif JP', serif;
    font-weight: 300;
    line-height: 2;
    letter-spacing: 0.08em;
    color: var(--ink);
    height: calc(100dvh - 80px);
    white-space: pre-wrap;
    word-break: break-all;
 }
    

  /* 縦中横 */
  .tcy {
    -webkit-text-combine: horizontal;
    text-combine-upright: all;
  }

  .tategumi.empty::after {
    content: 'テキストを入力すると\Aここに縦書きで表示されます';
    white-space: pre;
    color: var(--muted);
    opacity: 0.5;
    font-size: 13px;
  }

  /* --- ツールバー --- */
  .toolbar {
    position: fixed;
    bottom: 28px;
    right: 40px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(247, 244, 239, 0.9);
    padding: 4px 8px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }

  .size-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.1em;
    padding: 6px 16px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    border-radius: 2px;
  }

  .btn:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .btn-size {
    padding: 5px 10px;
    font-size: 12px;
    min-width: 38px;
    text-align: center;
  }

  /* スクロールバー */
  .preview-pane::-webkit-scrollbar,
  .fullscreen-overlay::-webkit-scrollbar { height: 6px; }
  .preview-pane::-webkit-scrollbar-track,
  .fullscreen-overlay::-webkit-scrollbar-track { background: transparent; }
  .preview-pane::-webkit-scrollbar-thumb,
  .fullscreen-overlay::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .preview-pane::-webkit-scrollbar-thumb:hover,
  .fullscreen-overlay::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  @media (max-width: 680px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr 1px 1.2fr;
      height: 100dvh;
    }
    .divider { grid-row: 3; grid-column: 1; height: 1px; width: 100%; }
    .input-pane {
      grid-row: 2;
      height: 100%;
      padding: 20px;
    }
    .preview-pane {
      grid-row: 4;
      padding: 20px;
      height: 100%;
    }
    .tategumi {
      height: calc(100% - 40px);
    }
    header { padding: 16px 20px 12px; }
    h1 { font-size: 13px; }
    .toolbar {
      bottom: 12px;
      right: 12px;
      gap: 4px;
      padding: 2px;
    }
    .btn { padding: 4px 8px; font-size: 11px; }
    .btn-size { padding: 4px 6px; min-width: 30px; }
    .size-label { display: none; }
  }
</style>
</head>
<body>

<div class="layout">
  <header>
    <h1>縦書きプレビュー</h1>
    <span class="subtitle">note 用</span>
  </header>

  <div class="input-pane">
    <div class="pane-label">横書き入力</div>
    <textarea id="input" placeholder="note の文章をここにペーストしてください…" spellcheck="false"></textarea>
  </div>

  <div class="divider"></div>

  <div class="preview-pane" id="previewPane">
    <div class="tategumi empty" id="preview"></div>
  </div>
</div>

<div class="fullscreen-overlay" id="fullscreenOverlay">
  <div class="tategumi-full" id="fullPreview"></div>
</div>

<div class="toolbar">
  <span class="font-label">フォント</span>
<button class="btn btn-size" id="btnGothic">ゴシック</button>
<button class="btn btn-size" id="btnShippori">筆</button>
<button class="btn btn-size" id="btnKaisei">装飾</button>
<button class="btn btn-size" id="btnHina">細い</button>


  <span class="size-label">文字サイズ</span>
  <button class="btn btn-size" id="btnSmall">小</button>
  <button class="btn btn-size" id="btnMedium">中</button>
  <button class="btn btn-size" id="btnLarge">大</button>
  <button class="btn btn-size" id="btnXLarge">特大</button>
  <button class="btn" id="btnClear">クリア</button>
  <button class="btn" id="btnFullscreen">全画面</button>
</div>

<script>
  const input = document.getElementById('input');
  const preview = document.getElementById('preview');
  const sizes = { '小': '13px', '中': '15px', '大': '18px', '特大': '24px' };

  // 半角→全角変換
  const toZen = (s) => s.replace(/[0-9]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0))
                        .replace(/[a-z]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0))
                        .replace(/[A-Z]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0));

  const symbolMap = {
    '(': '︵', ')': '︶',
    '（': '︵', '）': '︶',
    '[': '﹇', ']': '﹈',
    '【': '︻', '】': '︼',
    '﹁': '﹁', '﹂': '﹂',
    '{': '︷', '}': '︸',
    '…': '︙',
    '—': '︱',
  };

  function toTategumi(text) {
    if (!text) return '';
    let s = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;');

    s = s.replace(/[A-Za-z0-9]+/g, m => toZen(m));
    s = s.replace(/>/g, '＞');

    for (const [from, to] of Object.entries(symbolMap)) {
      s = s.split(from).join(to);
    }
    return s;
  }

  input.addEventListener('input', () => {
    const val = input.value;
    preview.innerHTML = toTategumi(val);
    preview.classList.toggle('empty', val.trim() === '');
  });

  let currentSize = sizes['中'];

  function setSize(size) {
    currentSize = size;
    preview.style.fontSize = size;
    const headerH = document.querySelector('header').offsetHeight;
    preview.style.height = `calc(100dvh - ${headerH + 60}px)`;
  }

  setSize(sizes['中']);

  document.getElementById('btnSmall').addEventListener('click', () => setSize(sizes['小']));
  document.getElementById('btnMedium').addEventListener('click', () => setSize(sizes['中']));
  document.getElementById('btnLarge').addEventListener('click', () => setSize(sizes['大']));
  document.getElementById('btnXLarge').addEventListener('click', () => setSize(sizes['特大']));

  document.getElementById('btnClear').addEventListener('click', () => {
    input.value = '';
    preview.innerHTML = '';
    preview.classList.add('empty');
    input.focus();
  });

  // --- 全画面モード ---
  const overlay = document.getElementById('fullscreenOverlay');
  const fullPreview = document.getElementById('fullPreview');

  document.getElementById('btnFullscreen').addEventListener('click', () => {
    if (input.value.trim() === '') return;
    fullPreview.innerHTML = preview.innerHTML + '<br><br><br><br><br>';

    fullPreview.style.fontSize = currentSize;
    overlay.classList.add('active');
    setTimeout(() => {
      overlay.scrollLeft = overlay.scrollWidth - overlay.clientWidth;
    }, 10);
  });

  function closeFullscreen() {
    overlay.classList.remove('active');
  }

  // PCダブルクリックで閉じる
  overlay.addEventListener('dblclick', () => {
    closeFullscreen();
  });

  // iPhoneダブルタップで閉じる
  let lastTap = 0;
  let touchStartTime = 0;

  overlay.addEventListener('touchstart', (e) => {
    touchStartTime = new Date().getTime();
  });

  overlay.addEventListener('touchend', (e) => {
    const currentTime = new Date().getTime();
    const touchDuration = currentTime - touchStartTime;

    if (touchDuration > 150) return;

    const tapLength = currentTime - lastTap;

    if (tapLength < 250 && tapLength > 40) {
      closeFullscreen();
      e.preventDefault();
    }
    lastTap = currentTime;
  });

  // Escキーで閉じる
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeFullscreen();
  });

  // マウスホイールで横スクロール
  overlay.addEventListener('wheel', (e) => {
    if (!overlay.classList.contains('active')) return;
    e.preventDefault();
    overlay.scrollLeft -= e.deltaY;
  }, { passive: false });
  // フォント切り替え
    document.getElementById('btnGothic').addEventListener('click', () => {
    preview.style.fontFamily = "'Noto Sans JP', sans-serif";
    fullPreview.style.fontFamily = "'Noto Sans JP', sans-serif";
  });

  document.getElementById('btnShippori').addEventListener('click', () => {
    preview.style.fontFamily = "'Shippori Mincho', serif";
    fullPreview.style.fontFamily = "'Shippori Mincho', serif";
  });

  document.getElementById('btnKaisei').addEventListener('click', () => {
    preview.style.fontFamily = "'Kaisei Decol', serif";
    fullPreview.style.fontFamily = "'Kaisei Decol', serif";
  });

  document.getElementById('btnHina').addEventListener('click', () => {
    preview.style.fontFamily = "'Hina Mincho', serif";
    fullPreview.style.fontFamily = "'Hina Mincho', serif";
  });

</script>
</body>
</html>
